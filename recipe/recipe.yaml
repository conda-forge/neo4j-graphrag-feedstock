schema_version: 1

context:
  name: neo4j-graphrag
  version: "1.22.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/neo4j_graphrag-${{ version }}.tar.gz
  sha256: 01bd2f4253048f0151b33f122d5016d167317c44b1c3c45bc66e3e38b47cb1d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - neo4j-python-driver >=6.3.1,<7.0.0
    - pydantic >=2.6.3,<3.0.0
    - fsspec >=2024.12.0,<2026.9.0
    - pypdf >=6.19.0,<7.0.0
    - json-repair >=0.44.1,<1.0.0
    - pyyaml >=6.0.3,<7.0.0
    - types-pyyaml >=6.0.12.20260906,<7.0.0
    - numpy >=2.1.0,<3.0.0
    - scipy >=1.15.0,<2.0.0
    - tenacity >=9.1.4,<10.0.0

tests:
  - python:
      imports:
        - neo4j_graphrag
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python package to allow easy integration to Neo4j's GraphRAG features
  license: Apache-2.0 AND PSF-2.0
  license_file:
    - LICENSE.APACHE2.txt
    - NOTICE.txt
    - LICENSE.PYTHON.txt
    - LICENSE.txt
  homepage: https://github.com/neo4j/neo4j-graphrag-python

extra:
  recipe-maintainers:
    - alexthomas93
    - stellasia
    - NathalieCharbel
